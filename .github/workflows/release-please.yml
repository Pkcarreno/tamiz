name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      apps/extension--tag_name: ${{ steps.release.outputs['apps/extension--tag_name'] }}
      apps/extension--version: ${{ steps.release.outputs['apps/extension--version'] }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build Extension
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' && contains(fromJSON(needs.release-please.outputs.paths_released), 'apps/extension')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      chrome-version: ${{ steps.version.outputs.chrome }}
      firefox-version: ${{ steps.version.outputs.firefox }}
      tag-name: ${{ needs.release-please.outputs['apps/extension--tag_name'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-install

      - name: Package extension archives
        run: bun run zip

      - name: Get version
        id: version
        run: |
          VERSION="${{ needs.release-please.outputs['apps/extension--version'] }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(jq -r '.version' apps/extension/package.json)
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "chrome=${VERSION}" >> $GITHUB_OUTPUT
          echo "firefox=${VERSION}" >> $GITHUB_OUTPUT

      - name: Rename zips for release
        run: |
          mv apps/extension/.output/*-chrome.zip "apps/extension/.output/tamiz-chrome-v${{ steps.version.outputs.version }}.zip"
          mv apps/extension/.output/*-firefox.zip "apps/extension/.output/tamiz-firefox-v${{ steps.version.outputs.version }}.zip"

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v7
        with:
          name: tamiz-chrome-v${{ steps.version.outputs.chrome }}
          path: apps/extension/.output/tamiz-chrome-v*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v7
        with:
          name: tamiz-firefox-v${{ steps.version.outputs.firefox }}
          path: |
            apps/extension/.output/tamiz-firefox-v*.zip
            apps/extension/.output/*-sources.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Attach zips to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs['apps/extension--tag_name'] }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "Error: Release tag name is missing" >&2
            exit 1
          fi
          gh release upload "$TAG_NAME" \
            "apps/extension/.output/tamiz-chrome-v${{ steps.version.outputs.version }}.zip" \
            "apps/extension/.output/tamiz-firefox-v${{ steps.version.outputs.version }}.zip" \
            apps/extension/.output/*-sources.zip \
            --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs['apps/extension--tag_name'] }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "Error: Release tag name is missing" >&2
            exit 1
          fi
          gh release edit "$TAG_NAME" --draft=false

  deploy-chrome:
    name: Deploy to Chrome Web Store
    needs: [release-please, build]
    concurrency:
      group: deploy-chrome-${{ needs.release-please.outputs['apps/extension--tag_name'] || needs.build.outputs.tag-name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-install

      - name: Download Chrome artifact
        uses: actions/download-artifact@v8
        with:
          name: tamiz-chrome-v${{ needs.build.outputs.chrome-version }}
          path: apps/extension/.output

      - name: Submit to Chrome Web Store
        run: |
          CHROME_ZIP=$(find apps/extension/.output -name "tamiz-chrome-v*.zip" | head -n 1)
          if [ -z "$CHROME_ZIP" ]; then
            echo "Error: Chrome extension zip not found in apps/extension/.output" >&2
            exit 1
          fi
          bun run submit:chrome -- --chrome-zip "$CHROME_ZIP"
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

  deploy-firefox:
    name: Deploy to Firefox Add-ons
    needs: [release-please, build]
    concurrency:
      group: deploy-firefox-${{ needs.release-please.outputs['apps/extension--tag_name'] || needs.build.outputs.tag-name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-install

      - name: Download Firefox artifact
        uses: actions/download-artifact@v8
        with:
          name: tamiz-firefox-v${{ needs.build.outputs.firefox-version }}
          path: apps/extension/.output

      - name: Submit to Firefox Add-ons
        run: |
          FIREFOX_ZIP=$(find apps/extension/.output -name "tamiz-firefox-v*.zip" | head -n 1)
          SOURCES_ZIP=$(find apps/extension/.output -name "*-sources.zip" | head -n 1)
          if [ -z "$FIREFOX_ZIP" ]; then
            echo "Error: Firefox extension zip not found in apps/extension/.output" >&2
            exit 1
          fi
          if [ -z "$SOURCES_ZIP" ]; then
            echo "Error: Firefox sources zip not found in apps/extension/.output" >&2
            exit 1
          fi
          export FIREFOX_JWT_ISSUER="${FIREFOX_JWT_ISSUER:-$FIREFOX_API_KEY}"
          export FIREFOX_JWT_SECRET="${FIREFOX_JWT_SECRET:-$FIREFOX_API_SECRET}"
          bun run submit:firefox -- \
            --firefox-zip "$FIREFOX_ZIP" \
            --firefox-sources-zip "$SOURCES_ZIP"
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER || secrets.FIREFOX_API_KEY }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET || secrets.FIREFOX_API_SECRET }}
          FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          FIREFOX_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
