name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      apps/extension--tag_name: ${{ steps.release.outputs['apps/extension--tag_name'] }}
      apps/extension--version: ${{ steps.release.outputs['apps/extension--version'] }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build Extension
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' && contains(fromJSON(needs.release-please.outputs.paths_released), 'apps/extension')
    runs-on: ubuntu-latest
    outputs:
      chrome-version: ${{ steps.version.outputs.chrome }}
      firefox-version: ${{ steps.version.outputs.firefox }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-install

      - name: Zip Chrome extension
        run: bun run --filter @tamiz/extension zip:chrome

      - name: Zip Firefox extension
        run: bun run --filter @tamiz/extension zip:firefox

      - name: Get version
        id: version
        run: |
          echo "chrome=$(jq -r '.version' apps/extension/package.json)" >> $GITHUB_OUTPUT
          echo "firefox=$(jq -r '.version' apps/extension/package.json)" >> $GITHUB_OUTPUT

      - name: Rename zips for release
        run: |
          mv apps/extension/.output/*-chrome.zip "apps/extension/.output/tamiz-chrome-v${{ steps.version.outputs.chrome }}.zip"
          mv apps/extension/.output/*-firefox.zip "apps/extension/.output/tamiz-firefox-v${{ steps.version.outputs.firefox }}.zip"

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v7
        with:
          name: tamiz-chrome-v${{ steps.version.outputs.chrome }}
          path: apps/extension/.output/tamiz-chrome-v*.zip
          retention-days: 30

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v7
        with:
          name: tamiz-firefox-v${{ steps.version.outputs.firefox }}
          path: apps/extension/.output/tamiz-firefox-v*.zip
          retention-days: 30

      - name: Attach zips to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs['apps/extension--tag_name'] }}
          files: |
            apps/extension/.output/tamiz-chrome-v*.zip
            apps/extension/.output/tamiz-firefox-v*.zip

  deploy-chrome:
    name: Deploy to Chrome Web Store
    needs: build
    concurrency:
      group: deploy-chrome-${{ needs.release-please.outputs['apps/extension--tag_name'] }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Download Chrome artifact
        uses: actions/download-artifact@v8
        with:
          name: tamiz-chrome-v${{ needs.build.outputs.chrome-version }}

      - name: Upload to Chrome Web Store
        uses: fregante/chrome-webstore-upload@v3
        with:
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          zip-file: ./*.zip
          publish: true

  deploy-firefox:
    name: Deploy to Firefox Add-ons
    needs: build
    concurrency:
      group: deploy-firefox-${{ needs.release-please.outputs['apps/extension--tag_name'] }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Download Firefox artifact
        uses: actions/download-artifact@v8
        with:
          name: tamiz-firefox-v${{ needs.build.outputs.firefox-version }}

      - name: Upload to Firefox Add-ons
        uses: trmcnvn/firefox-addon@v1
        with:
          guid: ${{ secrets.FIREFOX_EXTENSION_ID }}
          api-key: ${{ secrets.FIREFOX_API_KEY }}
          api-secret: ${{ secrets.FIREFOX_API_SECRET }}
          package: ./*.zip
