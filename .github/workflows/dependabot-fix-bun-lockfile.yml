name: Dependabot Fix Bun Lockfile

on:
  pull_request_target:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-bun-lockfile:
    name: Fix Bun Lockfile
    if: github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Regenerate lockfile
        run: bun install

      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "fix: regenerate bun.lock"
            git push
          fi
